<header>
  <span>{{ user().first_name }} {{ user().last_name }}</span>

  <label>
    {{ 'header.language' | transloco }}
    <select [value]="user().language" (change)="onLanguageChange($event)">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </label>

  <button type="button" (click)="logout.emit()">{{ 'header.logout' | transloco }}</button>
</header>
